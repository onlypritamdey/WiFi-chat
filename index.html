<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WiFi Chat Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0a84ff; --secondary: #2c2c2e; --green: #30d158; --danger: #ff453a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; position: fixed; }

        .main-wrapper { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

        /* Header */
        #header { padding: 10px 15px; background: var(--card); border-bottom: 1px solid var(--secondary); flex-shrink: 0; z-index: 10; }
        .id-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .id-badge { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
        .input-row { display: flex; gap: 8px; }

        /* FIXED FULL SCREEN VIDEO UI */
        #video-ui { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100dvh; 
            background: #000; 
            z-index: 9999; /* Higher than everything */
            flex-direction: column; 
        }
        
        /* Main Remote Video - Full Screen */
        #remote-video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute;
            top: 0; left: 0;
        }

        /* Your Small Camera - Floating on top */
        #local-video-pip { 
            position: absolute; 
            top: calc(20px + env(safe-area-inset-top)); 
            right: 20px; 
            width: 100px; height: 150px; 
            border-radius: 12px; 
            border: 1.5px solid rgba(255,255,255,0.3); 
            object-fit: cover; 
            z-index: 10000;
            background: #222;
        }

        /* Controls Area - Floating at bottom */
        .v-controls { 
            position: absolute; 
            bottom: calc(40px + env(safe-area-inset-bottom)); 
            left: 0; width: 100%; 
            display: flex; justify-content: center; gap: 12px; 
            z-index: 10001; 
        }

        .v-btn { 
            width: 58px; height: 58px; border-radius: 50%; border: none; 
            background: rgba(255,255,255,0.2); color: white; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 11px; font-weight: 600; backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .v-btn.off { background: var(--danger); }
        .v-btn.end { background: var(--danger); }

        /* Incoming Call Popup */
        #call-popup {
            display: none; position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 320px; background: var(--card); border: 1px solid var(--accent);
            border-radius: 24px; padding: 25px; text-align: center; z-index: 10002; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Chat Styling */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 75%; font-size: 15px; }
        .sent { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--secondary); border-bottom-left-radius: 4px; }
        .system { align-self: center; font-size: 11px; color: #888; margin: 10px 0; font-weight: 500; }

        #input-area { padding: 10px 15px; background: var(--card); border-top: 1px solid var(--secondary); flex-shrink: 0; }
        input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; background: var(--secondary); color: white; font-size: 16px; outline: none; }
        button { border: none; padding: 10px 20px; border-radius: 25px; font-weight: 600; cursor: pointer; color: white; }
        .btn-blue { background: var(--accent); }
        .btn-green { background: var(--green); display: none; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="header">
        <div class="id-row">
            <span>MY ID: <span id="my-id" class="id-badge">....</span></span>
            <button id="v-call-btn" class="btn-green" onclick="startCall()">Video Call</button>
        </div>
        <div class="input-row">
            <input id="friend-id" type="number" pattern="\d*" placeholder="Enter ID">
            <button class="btn-blue" onclick="connectToFriend()">Connect</button>
        </div>
    </div>

    <div id="call-popup">
        <h2 style="margin:0 0 10px 0; font-size: 1.2rem;">Incoming Call</h2>
        <p style="color:#aaa; font-size: 0.9rem; margin-bottom: 20px;">Your family member is calling...</p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <button onclick="answerCall()" style="background:var(--green); flex:1;">Answer</button>
            <button onclick="declineCall()" style="background:var(--danger); flex:1;">Decline</button>
        </div>
    </div>

    <div id="video-ui">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video-pip" autoplay muted playsinline></video>
        <div class="v-controls">
            <button class="v-btn" id="mute-btn" onclick="toggleMute()">Mute</button>
            <button class="v-btn" id="cam-btn" onclick="toggleVideo()">Cam</button>
            <button class="v-btn" onclick="switchCamera()">Swap</button>
            <button class="v-btn end" onclick="endCall()">End</button>
        </div>
    </div>

    <div id="chat-box"><div class="system">PRIVATE CONNECTION READY</div></div>

    <div id="input-area">
        <div class="input-row">
            <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
            <button class="btn-blue" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const myIdDisplay = document.getElementById('my-id');
    const shortId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(shortId); 
    let connection, localStream, currentCall, incomingCall;
    let isMuted = false, isVideoOff = false, facingMode = "user";

    peer.on('open', id => myIdDisplay.innerText = id);
    peer.on('connection', conn => { connection = conn; setupEvents(); });

    peer.on('call', call => {
        incomingCall = call;
        document.getElementById('call-popup').style.display = 'block';
    });

    async function answerCall() {
        document.getElementById('call-popup').style.display = 'none';
        localStream = await getMedia();
        showVideoUI(localStream);
        incomingCall.answer(localStream);
        currentCall = incomingCall;
        currentCall.on('stream', rs => {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = rs;
            remoteVideo.play();
        });
    }

    function declineCall() {
        document.getElementById('call-popup').style.display = 'none';
        incomingCall.close();
    }

    async function getMedia() {
        return await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode }, audio: true 
        });
    }

    function showVideoUI(stream) {
        const ui = document.getElementById('video-ui');
        ui.style.display = 'flex';
        document.getElementById('local-video-pip').srcObject = stream;
    }

    function endCall() {
        if(currentCall) currentCall.close();
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('video-ui').style.display = 'none';
    }

    function toggleMute() {
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById('mute-btn').classList.toggle('off', isMuted);
        document.getElementById('mute-btn').innerText = isMuted ? "Unmute" : "Mute";
    }

    function toggleVideo() {
        isVideoOff = !isVideoOff;
        localStream.getVideoTracks()[0].enabled = !isVideoOff;
        document.getElementById('cam-btn').classList.toggle('off', isVideoOff);
        document.getElementById('cam-btn').innerText = isVideoOff ? "Cam On" : "Cam Off";
    }

    async function switchCamera() {
        facingMode = (facingMode === "user") ? "environment" : "user";
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            const newStream = await getMedia();
            document.getElementById('local-video-pip').srcObject = newStream;
            if (currentCall) {
                const videoTrack = newStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if(sender) sender.replaceTrack(videoTrack);
            }
            localStream = newStream;
        }
    }

    function connectToFriend() {
        const id = document.getElementById('friend-id').value;
        if(!id) return;
        connection = peer.connect(id);
        setupEvents();
    }

    async function startCall() {
        const id = document.getElementById('friend-id').value;
        localStream = await getMedia();
        showVideoUI(localStream);
        currentCall = peer.call(id, localStream);
        currentCall.on('stream', rs => {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = rs;
            remoteVideo.play();
        });
    }

    function setupEvents() {
        connection.on('open', () => {
            appendMessage("", "SECURE CONNECTION ESTABLISHED", 'system');
            document.getElementById('v-call-btn').style.display = 'block';
        });
        connection.on('data', data => appendMessage("Friend", data, 'received'));
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (connection && input.value) {
            connection.send(input.value);
            appendMessage("You", input.value, 'sent');
            input.value = "";
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        const box = document.getElementById('chat-box');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
