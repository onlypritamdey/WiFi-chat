<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WiFi Chat</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22WiFi%20Chat%22,%22short_name%22:%22WiFiChat%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#000000%22}">

    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0a84ff; --secondary: #2c2c2e; --green: #30d158; --danger: #ff453a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; position: fixed; }

        .main-wrapper { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

        /* Header */
        #header { padding: 10px 15px; background: var(--card); border-bottom: 1px solid var(--secondary); flex-shrink: 0; z-index: 10; }
        .id-badge { font-weight: bold; color: var(--accent); font-size: 1.1rem; letter-spacing: 1px; }
        .input-row { display: flex; gap: 8px; margin-top: 10px; }

        /* Full Screen Video UI */
        #video-ui { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 9999; flex-direction: column; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #local-video-pip { position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px; width: 100px; height: 150px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.3); object-fit: cover; z-index: 10000; background: #222; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

        /* Icon Buttons */
        .v-controls { position: absolute; bottom: calc(50px + env(safe-area-inset-bottom)); left: 0; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10001; }
        .v-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: white; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: all 0.2s; }
        .v-btn.off { background: var(--danger); color: white; }
        .v-btn.end { background: var(--danger); width: 70px; }
        .v-btn:active { transform: scale(0.9); }

        /* Popup */
        #call-popup { display: none; position: fixed; top: 15%; left: 50%; transform: translateX(-50%); width: 85%; max-width: 320px; background: var(--card); border-radius: 28px; padding: 25px; text-align: center; z-index: 10002; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid #333; }

        /* Chat */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; scroll-behavior: smooth; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 75%; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--secondary); border-bottom-left-radius: 4px; }
        .system { align-self: center; font-size: 11px; color: #666; margin: 10px 0; text-transform: uppercase; letter-spacing: 1px; }

        /* Footer */
        #input-area { padding: 10px 15px; background: var(--card); border-top: 1px solid var(--secondary); flex-shrink: 0; }
        input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; background: var(--secondary); color: white; font-size: 16px; outline: none; }
        .send-btn { background: var(--accent); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="header">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span><i data-lucide="wifi" style="width:16px;vertical-align:middle"></i> MY ID: <span id="my-id" class="id-badge">....</span></span>
            <button id="v-call-btn" style="background:var(--green); display:none; padding:8px 15px; border-radius:20px; color:white; border:none; font-weight:600;" onclick="startCall()">
                <i data-lucide="video" style="width:18px; vertical-align:middle; margin-right:5px"></i> Video Call
            </button>
        </div>
        <div class="input-row">
            <input id="friend-id" type="number" pattern="\d*" placeholder="Enter Friend's ID">
            <button onclick="connectToFriend()" style="background:var(--accent); color:white; border:none; padding:0 20px; border-radius:25px; font-weight:600;">Connect</button>
        </div>
    </div>

    <div id="call-popup">
        <div style="background:var(--accent); width:60px; height:60px; border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center;">
            <i data-lucide="phone-incoming" style="width:30px; height:30px"></i>
        </div>
        <h2 style="margin:0 0 5px 0">Incoming Call</h2>
        <p style="color:#888; margin-bottom:25px">Family is calling...</p>
        <div style="display:flex; gap:12px;">
            <button onclick="answerCall()" style="background:var(--green); flex:1; padding:15px; border-radius:15px; color:white; border:none; font-weight:bold;">Answer</button>
            <button onclick="declineCall()" style="background:var(--danger); flex:1; padding:15px; border-radius:15px; color:white; border:none; font-weight:bold;">Decline</button>
        </div>
    </div>

    <div id="video-ui">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video-pip" autoplay muted playsinline></video>
        <div class="v-controls">
            <button class="v-btn" id="mute-btn" onclick="toggleMute()"><i data-lucide="mic"></i></button>
            <button class="v-btn" id="cam-btn" onclick="toggleVideo()"><i data-lucide="video"></i></button>
            <button class="v-btn" onclick="switchCamera()"><i data-lucide="camera-reverse"></i></button>
            <button class="v-btn end" onclick="endCall()"><i data-lucide="phone-off"></i></button>
        </div>
    </div>

    <div id="chat-box"><div class="system">Encrypted WiFi Chat Active</div></div>

    <div id="input-area">
        <div style="display:flex; gap:10px; align-items:center;">
            <input id="message-input" type="text" placeholder="Message..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()"><i data-lucide="send" style="width:20px"></i></button>
        </div>
    </div>
</div>

<script>
    // SFX Assets
    const msgSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3');
    const callSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3');
    callSfx.loop = true;

    const myIdDisplay = document.getElementById('my-id');
    const shortId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(shortId); 
    let connection, localStream, currentCall, incomingCall;
    let isMuted = false, isVideoOff = false, facingMode = "user";

    // Initialize Icons
    lucide.createIcons();

    peer.on('open', id => myIdDisplay.innerText = id);
    peer.on('connection', conn => { connection = conn; setupEvents(); });

    peer.on('call', call => {
        incomingCall = call;
        callSfx.play();
        document.getElementById('call-popup').style.display = 'block';
    });

    async function answerCall() {
        callSfx.pause();
        document.getElementById('call-popup').style.display = 'none';
        localStream = await getMedia();
        showVideoUI(localStream);
        incomingCall.answer(localStream);
        currentCall = incomingCall;
        currentCall.on('stream', rs => { document.getElementById('remote-video').srcObject = rs; });
    }

    function declineCall() {
        callSfx.pause();
        document.getElementById('call-popup').style.display = 'none';
        incomingCall.close();
    }

    async function getMedia() {
        return await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: true });
    }

    function showVideoUI(stream) {
        document.getElementById('video-ui').style.display = 'flex';
        document.getElementById('local-video-pip').srcObject = stream;
    }

    function endCall() {
        if(currentCall) currentCall.close();
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('video-ui').style.display = 'none';
        callSfx.pause();
    }

    function toggleMute() {
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById('mute-btn').classList.toggle('off', isMuted);
        document.getElementById('mute-btn').innerHTML = isMuted ? '<i data-lucide="mic-off"></i>' : '<i data-lucide="mic"></i>';
        lucide.createIcons();
    }

    function toggleVideo() {
        isVideoOff = !isVideoOff;
        localStream.getVideoTracks()[0].enabled = !isVideoOff;
        document.getElementById('cam-btn').classList.toggle('off', isVideoOff);
        document.getElementById('cam-btn').innerHTML = isVideoOff ? '<i data-lucide="video-off"></i>' : '<i data-lucide="video"></i>';
        lucide.createIcons();
    }

    async function switchCamera() {
        facingMode = (facingMode === "user") ? "environment" : "user";
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            const newStream = await getMedia();
            document.getElementById('local-video-pip').srcObject = newStream;
            if (currentCall) {
                const videoTrack = newStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if(sender) sender.replaceTrack(videoTrack);
            }
            localStream = newStream;
        }
    }

    function connectToFriend() {
        const id = document.getElementById('friend-id').value;
        if(!id) return;
        connection = peer.connect(id);
        setupEvents();
    }

    async function startCall() {
        const id = document.getElementById('friend-id').value;
        localStream = await getMedia();
        showVideoUI(localStream);
        currentCall = peer.call(id, localStream);
        currentCall.on('stream', rs => { document.getElementById('remote-video').srcObject = rs; });
    }

    function setupEvents() {
        connection.on('open', () => {
            appendMessage("", "CONNECTED", 'system');
            document.getElementById('v-call-btn').style.display = 'block';
        });
        connection.on('data', data => {
            msgSfx.play();
            appendMessage("Friend", data, 'received');
        });
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (connection && input.value) {
            connection.send(input.value);
            appendMessage("You", input.value, 'sent');
            input.value = "";
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        const box = document.getElementById('chat-box');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // Register Service Worker for PWA Offline Support
    if ('serviceWorker' in navigator) {
        const sw = 'data:application/javascript;base64,' + btoa('self.addEventListener("fetch", (e) => e.respondWith(fetch(e.request)));');
        navigator.serviceWorker.register(sw);
    }
</script>
</body>
</html>
