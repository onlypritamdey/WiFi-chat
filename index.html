<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotspot Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --accent: #0a84ff;
            --secondary: #323232;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; background: var(--bg); color: var(--text); 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #header { padding: 15px; background: var(--card); border-bottom: 1px solid var(--secondary); }
        .id-badge { font-weight: bold; color: var(--accent); font-size: 1.2rem; }
        
        #chat-box { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 8px;
            background: var(--bg);
        }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; font-size: 15px; word-wrap: break-word; }
        .sent { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--secondary); color: white; border-bottom-left-radius: 4px; }
        .system { align-self: center; font-size: 12px; color: #888; background: transparent; }

        #controls { 
            padding: 15px; background: var(--card); 
            display: flex; flex-direction: column; gap: 10px;
            border-top: 1px solid var(--secondary); padding-bottom: 30px; /* Space for iPhone home bar */
        }
        .row { display: flex; gap: 8px; }
        input { 
            flex: 1; padding: 12px 15px; border-radius: 25px; 
            border: 1px solid var(--secondary); background: #2c2c2e; 
            color: white; font-size: 16px; outline: none;
        }
        button { 
            background: var(--accent); color: white; border: none; 
            padding: 12px 20px; border-radius: 25px; font-weight: 600; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        .connect-btn { background: #30d158; }
    </style>
</head>
<body>

<div id="header">
    <div style="font-size: 13px; color: #888;">MY ID: <span id="my-id" class="id-badge">....</span></div>
    <div class="row" style="margin-top: 8px;">
        <input id="friend-id" type="number" pattern="\d*" placeholder="Enter 4-digit ID">
        <button class="connect-btn" onclick="connectToFriend()">Connect</button>
    </div>
</div>

<div id="chat-box">
    <div class="msg system">Ready to connect over Hotspot</div>
</div>

<div id="controls">
    <div class="row">
        <input id="message-input" type="text" placeholder="Message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const myIdDisplay = document.getElementById('my-id');
    const shortId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(shortId); 
    let connection;

    peer.on('open', id => myIdDisplay.innerText = id);

    peer.on('connection', conn => {
        connection = conn;
        setupEvents();
    });

    function connectToFriend() {
        const id = document.getElementById('friend-id').value;
        if (!id) return;
        connection = peer.connect(id);
        setupEvents();
    }

    function setupEvents() {
        connection.on('open', () => appendMessage("System", "Connected!", 'system'));
        connection.on('data', data => appendMessage("Friend", data, 'received'));
        connection.on('close', () => appendMessage("System", "Disconnected", 'system'));
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (connection && input.value) {
            connection.send(input.value);
            appendMessage("You", input.value, 'sent');
            input.value = "";
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Allow "Enter" key to send message
    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
