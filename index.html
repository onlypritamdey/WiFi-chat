<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WiFi Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0a84ff; --secondary: #2c2c2e; --green: #30d158; --danger: #ff453a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; position: fixed; }
        .main-wrapper { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        #header { padding: 15px; background: var(--card); border-bottom: 1px solid var(--secondary); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .status-dot { height: 10px; width: 10px; background: #333; border-radius: 50%; display: inline-block; margin-right: 8px; transition: 0.3s; }
        .online { background: var(--green); box-shadow: 0 0 12px var(--green); }
        #role-label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        #video-ui { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 9999; flex-direction: column; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #local-video-pip { position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px; width: 100px; height: 150px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); object-fit: cover; z-index: 10000; background: #222; }
        .v-controls { position: absolute; bottom: calc(60px + env(safe-area-inset-bottom)); left: 0; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 10001; }
        .v-btn { width: 62px; height: 62px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: white; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); font-size: 24px; }
        .v-btn.off { background: var(--danger); }
        #call-popup { display: none; position: fixed; top: 15%; left: 50%; transform: translateX(-50%); width: 85%; max-width: 320px; background: var(--card); border-radius: 30px; padding: 30px; text-align: center; z-index: 10002; border: 1px solid #333; }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; }
        .msg { padding: 12px 18px; border-radius: 22px; max-width: 80%; font-size: 16px; }
        .sent { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--secondary); border-bottom-left-radius: 4px; }
        #input-area { padding: 12px 15px; background: var(--card); border-top: 1px solid var(--secondary); }
        .input-row { display: flex; gap: 12px; align-items: center; }
        input { flex: 1; padding: 14px 20px; border-radius: 30px; border: none; background: var(--secondary); color: white; font-size: 16px; }
        .send-btn { background: var(--accent); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body onclick="forceAudioStart()">

<div class="main-wrapper">
    <div id="header">
        <div><span id="status-dot" class="status-dot"></span> <span id="role-label">SYNCING...</span></div>
        <button id="v-call-btn" style="background:var(--green); border:none; color:white; width:45px; height:45px; border-radius:50%; display:none;" onclick="startCall()">
            <i class="fas fa-video"></i>
        </button>
    </div>

    <div id="call-popup">
        <i class="fas fa-phone-alt fa-beat" style="font-size:40px; color:var(--accent); margin-bottom:20px"></i>
        <h2 style="margin:0">Incoming</h2>
        <div style="display:flex; gap:12px; margin-top:25px;">
            <button onclick="answerCall()" style="background:var(--green); flex:1; padding:18px; border-radius:18px; color:white; border:none; font-weight:bold;">ANSWER</button>
            <button onclick="declineCall()" style="background:var(--danger); flex:1; padding:18px; border-radius:18px; color:white; border:none; font-weight:bold;">IGNORE</button>
        </div>
    </div>

    <div id="video-ui">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video-pip" autoplay muted playsinline></video>
        <div class="v-controls">
            <button class="v-btn" id="mute-btn" onclick="toggleMute()"><i class="fas fa-microphone"></i></button>
            <button class="v-btn" id="cam-btn" onclick="toggleVideo()"><i class="fas fa-video"></i></button>
            <button class="v-btn" onclick="switchCamera()"><i class="fas fa-camera-rotate"></i></button>
            <button class="v-btn end" style="background:var(--danger)" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <div class="input-row">
            <input id="message-input" type="text" placeholder="Message..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    const sounds = {
        msg: new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3'),
        ring: new Audio('https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3'),
        dial: new Audio('https://assets.mixkit.co/active_storage/sfx/1351/1351-preview.mp3'),
        up: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
        down: new Audio('https://assets.mixkit.co/active_storage/sfx/2567/2567-preview.mp3')
    };
    sounds.ring.loop = true; sounds.dial.loop = true;

    let audioEnabled = false;
    function forceAudioStart() {
        if (!audioEnabled) {
            Object.values(sounds).forEach(s => { s.play(); s.pause(); s.currentTime = 0; });
            audioEnabled = true;
        }
    }

    function killSounds() { Object.values(sounds).forEach(s => { s.pause(); s.currentTime = 0; }); }

    const BASE_ID = "BANPUR_STATION_MAIN";
    const MEMBER_ID = "MEMBER_" + Math.floor(Math.random() * 999);
    let peer, myId, targetId, connection, localStream, currentCall, incomingCall, facingMode = "user";

    function startApp() {
        peer = new Peer(BASE_ID);
        peer.on('open', (id) => { 
            myId = BASE_ID; 
            document.getElementById('role-label').innerText = "BASE ONLINE";
            document.getElementById('status-dot').classList.add('online');
            setupPeerListeners();
        });
        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                myId = MEMBER_ID; targetId = BASE_ID;
                peer = new Peer(myId);
                peer.on('open', () => {
                    document.getElementById('role-label').innerText = "MEMBER ONLINE";
                    document.getElementById('status-dot').classList.add('online');
                    reconnect();
                });
                setupPeerListeners();
            }
        });
    }

    function setupPeerListeners() {
        peer.on('connection', conn => { connection = conn; targetId = conn.peer; wireChat(); });
        peer.on('call', call => { 
            incomingCall = call; 
            killSounds(); sounds.ring.play();
            document.getElementById('call-popup').style.display = 'block'; 
        });
    }

    function reconnect() { if (targetId) { connection = peer.connect(targetId); wireChat(); } }

    function wireChat() {
        connection.on('open', () => { document.getElementById('v-call-btn').style.display = 'block'; });
        connection.on('data', data => {
            if (data === "___PICKUP___") { killSounds(); sounds.up.play(); return; }
            if (data === "___HANGUP___") { endCall(); return; }
            sounds.msg.play(); appendMessage("Family", data, 'received');
        });
        connection.on('close', () => { document.getElementById('v-call-btn').style.display = 'none'; setTimeout(reconnect, 3000); });
    }

    async function startCall() {
        killSounds(); sounds.dial.play();
        localStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facingMode}, audio: true});
        currentCall = peer.call(targetId, localStream);
        currentCall.on('stream', rs => { 
            killSounds(); sounds.up.play();
            showVideo(localStream);
            document.getElementById('remote-video').srcObject = rs;
        });
    }

    async function answerCall() {
        connection.send("___PICKUP___");
        killSounds(); sounds.up.play();
        document.getElementById('call-popup').style.display = 'none';
        localStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facingMode}, audio: true});
        showVideo(localStream);
        incomingCall.answer(localStream);
        currentCall = incomingCall;
        currentCall.on('stream', rs => { document.getElementById('remote-video').srcObject = rs; });
    }

    function declineCall() { killSounds(); document.getElementById('call-popup').style.display = 'none'; incomingCall.close(); }

    function endCall() {
        if (connection && connection.open) connection.send("___HANGUP___");
        killSounds(); sounds.down.play();
        if(currentCall) currentCall.close();
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('video-ui').style.display = 'none';
    }

    function showVideo(s) { document.getElementById('video-ui').style.display = 'flex'; document.getElementById('local-video-pip').srcObject = s; }

    async function switchCamera() {
        facingMode = (facingMode === "user") ? "environment" : "user";
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facingMode}, audio: true});
            document.getElementById('local-video-pip').srcObject = localStream;
            if (currentCall) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if(sender) sender.replaceTrack(videoTrack);
            }
        }
    }

    function toggleMute() { const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; document.getElementById('mute-btn').classList.toggle('off', !t.enabled); }
    function toggleVideo() { const t = localStream.getVideoTracks()[0]; t.enabled = !t.enabled; document.getElementById('cam-btn').classList.toggle('off', !t.enabled); }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (connection && connection.open && input.value) {
            connection.send(input.value);
            appendMessage("You", input.value, 'sent');
            input.value = "";
        }
    }

    function appendMessage(s, t, type) {
        const div = document.createElement('div'); div.className = `msg ${type}`; div.innerText = t;
        const box = document.getElementById('chat-box'); box.appendChild(div); box.scrollTop = box.scrollHeight;
    }

    startApp();
</script>
</body>
</html>
