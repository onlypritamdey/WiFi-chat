<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Home WiFi Chat</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/font/lucide.min.css">

    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0a84ff; --secondary: #2c2c2e; --green: #30d158; --danger: #ff453a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; position: fixed; }

        .main-wrapper { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

        /* Header - Simplified for Home Auto-Connect */
        #header { padding: 15px; background: var(--card); border-bottom: 1px solid var(--secondary); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .status-dot { height: 8px; width: 8px; background: #555; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: var(--green); box-shadow: 0 0 8px var(--green); }

        /* Video UI */
        #video-ui { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 9999; flex-direction: column; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; position: absolute; background: #111; }
        #local-video-pip { position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px; width: 100px; height: 150px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); object-fit: cover; z-index: 10000; background: #222; }

        .v-controls { position: absolute; bottom: calc(60px + env(safe-area-inset-bottom)); left: 0; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 10001; }
        .v-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: rgba(255,255,255,0.2); color: white; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); font-size: 24px; }
        .v-btn.off { background: var(--danger); }
        .v-btn.end { background: var(--danger); }

        /* Popup */
        #call-popup { display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); width: 85%; max-width: 300px; background: var(--card); border-radius: 25px; padding: 25px; text-align: center; z-index: 10002; border: 1px solid #333; }

        /* Chat */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #000; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 80%; font-size: 16px; }
        .sent { align-self: flex-end; background: var(--accent); }
        .received { align-self: flex-start; background: var(--secondary); }
        
        /* Footer */
        #input-area { padding: 10px 15px; background: var(--card); border-top: 1px solid var(--secondary); flex-shrink: 0; }
        .input-row { display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; background: var(--secondary); color: white; font-size: 16px; outline: none; }
        
        /* Fixed Send Icon visibility */
        .icon-btn { background: var(--accent); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        /* Lucide Font Classes */
        .lucide { font-family: 'lucide' !important; font-style: normal; font-weight: normal; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="header">
        <div><span id="status-dot" class="status-dot"></span> <b>HOME CHAT</b></div>
        <button id="v-call-btn" style="background:var(--green); border:none; color:white; padding:8px 15px; border-radius:20px; font-weight:bold; display:none;" onclick="startCall()">
            <i class="lucide lucide-video"></i> CALL
        </button>
    </div>

    <div id="call-popup">
        <i class="lucide lucide-phone-incoming" style="font-size:40px; color:var(--accent)"></i>
        <h2 style="margin:10px 0">Family Calling</h2>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="answerCall()" style="background:var(--green); flex:1; padding:15px; border-radius:15px; color:white; border:none; font-weight:bold;">ANSWER</button>
            <button onclick="declineCall()" style="background:var(--danger); flex:1; padding:15px; border-radius:15px; color:white; border:none; font-weight:bold;">IGNORE</button>
        </div>
    </div>

    <div id="video-ui">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video-pip" autoplay muted playsinline></video>
        <div class="v-controls">
            <button class="v-btn" id="mute-btn" onclick="toggleMute()"><i class="lucide lucide-mic"></i></button>
            <button class="v-btn" id="cam-btn" onclick="toggleVideo()"><i class="lucide lucide-video"></i></button>
            <button class="v-btn" onclick="switchCamera()"><i class="lucide lucide-refresh-cw"></i></button>
            <button class="v-btn end" onclick="endCall()"><i class="lucide lucide-phone-off"></i></button>
        </div>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <div class="input-row">
            <input id="message-input" type="text" placeholder="Message Family..." autocomplete="off">
            <button class="icon-btn" onclick="sendMessage()"><i class="lucide lucide-send"></i></button>
        </div>
    </div>
</div>

<script>
    // --- HOME CONFIGURATION ---
    // Make sure one device is 'home-base-1' and the other is 'home-base-2'
    // To automate: we check if we are the "First" or "Second" person to join.
    const urlParams = new URLSearchParams(window.location.search);
    const isUserTwo = urlParams.has('user2'); 
    const myRole = isUserTwo ? "HOME_2" : "HOME_1";
    const targetRole = isUserTwo ? "HOME_1" : "HOME_2";

    const peer = new Peer(myRole); 
    let connection, localStream, currentCall, incomingCall;
    let facingMode = "user";

    // Sounds
    const msgSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3');

    peer.on('open', (id) => {
        document.getElementById('status-dot').classList.add('online');
        // Auto-attempt connection to the other family member
        setTimeout(autoConnect, 1000);
    });

    function autoConnect() {
        connection = peer.connect(targetRole);
        setupEvents();
    }

    peer.on('connection', conn => {
        connection = conn;
        setupEvents();
    });

    peer.on('call', call => {
        incomingCall = call;
        document.getElementById('call-popup').style.display = 'block';
    });

    async function answerCall() {
        document.getElementById('call-popup').style.display = 'none';
        localStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facingMode}, audio: true});
        showVideoUI(localStream);
        incomingCall.answer(localStream);
        currentCall = incomingCall;
        currentCall.on('stream', rs => { document.getElementById('remote-video').srcObject = rs; });
    }

    function declineCall() {
        document.getElementById('call-popup').style.display = 'none';
        incomingCall.close();
    }

    async function startCall() {
        localStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facingMode}, audio: true});
        showVideoUI(localStream);
        currentCall = peer.call(targetRole, localStream);
        currentCall.on('stream', rs => { document.getElementById('remote-video').srcObject = rs; });
    }

    function showVideoUI(stream) {
        document.getElementById('video-ui').style.display = 'flex';
        document.getElementById('local-video-pip').srcObject = stream;
    }

    function endCall() {
        if(currentCall) currentCall.close();
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        document.getElementById('video-ui').style.display = 'none';
    }

    async function switchCamera() {
        facingMode = (facingMode === "user") ? "environment" : "user";
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: facingMode}, audio: true});
            document.getElementById('local-video-pip').srcObject = localStream;
            if (currentCall) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if(sender) sender.replaceTrack(videoTrack);
            }
        }
    }

    function toggleMute() {
        const track = localStream.getAudioTracks()[0];
        track.enabled = !track.enabled;
        document.getElementById('mute-btn').classList.toggle('off', !track.enabled);
    }

    function toggleVideo() {
        const track = localStream.getVideoTracks()[0];
        track.enabled = !track.enabled;
        document.getElementById('cam-btn').classList.toggle('off', !track.enabled);
    }

    function setupEvents() {
        connection.on('open', () => {
            document.getElementById('v-call-btn').style.display = 'block';
            appendMessage("System", "Family Connected", 'received');
        });
        connection.on('data', data => {
            msgSfx.play();
            appendMessage("Family", data, 'received');
        });
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (connection && input.value) {
            connection.send(input.value);
            appendMessage("You", input.value, 'sent');
            input.value = "";
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        const box = document.getElementById('chat-box');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
