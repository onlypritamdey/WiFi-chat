<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Messenger</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f4f4f9; }
        #setup { padding: 20px; background: white; border-bottom: 1px solid #ddd; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 75%; font-size: 14px; line-height: 1.4; }
        .sent { align-self: flex-end; background: #007aff; color: white; }
        .received { align-self: flex-start; background: #e9e9eb; color: black; }
        #input-area { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; }
        small { color: #888; font-size: 11px; }
    </style>
</head>
<body>

<div id="setup">
    <strong>My ID:</strong> <span id="my-id">...</span><br>
    <small>Share this ID with your friend</small>
    <div style="margin-top:10px; display: flex; gap: 5px;">
        <input id="friend-id" type="text" placeholder="Enter Friend's ID">
        <button onclick="connectToFriend()">Connect</button>
    </div>
</div>

<div id="chat-box" id="messages"></div>

<div id="input-area">
    <input id="message-input" type="text" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
       const chatBox = document.getElementById('chat-box');
    const myIdDisplay = document.getElementById('my-id');
    
    // Generate a short 4-digit ID
    const shortId = Math.floor(1000 + Math.random() * 9000).toString();
    
    // Initialize Peer with the short ID
    const peer = new Peer(shortId); 
    let connection;

    peer.on('open', id => {
        myIdDisplay.innerText = id;
    });

    // If the ID is already taken, it will alert you
    peer.on('error', err => {
        if(err.type === 'unavailable-id') {
            alert("ID taken, refreshing for a new one...");
            location.reload();
        } else {
            alert("Connection error: " + err.type);
        }
    });

    peer.on('connection', conn => {
        connection = conn;
        handleData();
    });

    function connectToFriend() {
        const id = document.getElementById('friend-id').value;
        if (!id) return alert("Enter an ID");
        connection = peer.connect(id);
        handleData();
    }

    function handleData() {
        connection.on('open', () => {
            appendMessage("System", "Connected!", 'received');
        });
        connection.on('data', data => {
            appendMessage("Friend", data, 'received');
        });
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        const msg = input.value;
        if (connection && msg) {
            connection.send(msg);
            appendMessage("You", msg, 'sent');
            input.value = "";
        } else if (!connection) {
            alert("Not connected to anyone yet!");
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

</script>

</body>
</html>
