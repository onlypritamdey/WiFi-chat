<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hotspot Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #121212; --card: #1c1c1e; --text: #fff; --accent: #0a84ff; --secondary: #2c2c2e; --green: #30d158; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Forces the app to stay inside the screen boundaries */
        body, html { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, sans-serif; 
            overflow: hidden; position: fixed; /* Prevents bounce scrolling on iOS */
        }

        .main-wrapper {
            display: flex; flex-direction: column;
            height: 100dvh; /* Dynamic Viewport Height for mobile browsers */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Header Area */
        #header { 
            padding: 10px 15px; background: var(--card); 
            border-bottom: 1px solid var(--secondary); flex-shrink: 0; 
        }
        .id-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .id-badge { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
        .input-row { display: flex; gap: 8px; }

        /* Floating Video Container (Doesn't push chat) */
        #video-overlay { 
            display: none; position: absolute; top: 120px; right: 10px; 
            width: 120px; height: 160px; background: #000; 
            border-radius: 12px; overflow: hidden; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid var(--secondary);
        }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { 
            position: absolute; bottom: 5px; right: 5px; 
            width: 40px; height: 50px; border-radius: 4px; border: 1px solid #fff; 
        }

        /* Chat Area - The only part that scrolls */
        #chat-box { 
            flex-grow: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 10px;
            -webkit-overflow-scrolling: touch; 
        }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 15px; line-height: 1.4; }
        .sent { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--secondary); border-bottom-left-radius: 4px; }
        .system { align-self: center; font-size: 11px; color: #888; margin: 10px 0; }

        /* Input Area at the bottom */
        #input-area { 
            padding: 10px 15px; background: var(--card); 
            border-top: 1px solid var(--secondary); flex-shrink: 0;
        }
        input { 
            flex: 1; padding: 10px 15px; border-radius: 20px; 
            border: none; background: var(--secondary); color: white; 
            font-size: 16px; outline: none;
        }
        button { 
            border: none; padding: 8px 15px; border-radius: 20px; 
            font-weight: 600; font-size: 14px; color: white;
        }
        .btn-blue { background: var(--accent); }
        .btn-green { background: var(--green); display: none; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="header">
        <div class="id-row">
            <span style="font-size: 12px; color: #888;">MY ID: <span id="my-id" class="id-badge">....</span></span>
            <button id="v-call-btn" class="btn-green" onclick="startCall()">Video Call</button>
        </div>
        <div class="input-row">
            <input id="friend-id" type="number" pattern="\d*" placeholder="Enter Friend's ID">
            <button class="btn-blue" onclick="connectToFriend()">Connect</button>
        </div>
    </div>

    <div id="video-overlay">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
        <button style="position:absolute; top:0; right:0; background:rgba(0,0,0,0.5); padding:5px;" onclick="location.reload()">X</button>
    </div>

    <div id="chat-box">
        <div class="system">Waiting for connection...</div>
    </div>

    <div id="input-area">
        <div class="input-row">
            <input id="message-input" type="text" placeholder="Message..." autocomplete="off">
            <button class="btn-blue" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const myIdDisplay = document.getElementById('my-id');
    const shortId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(shortId); 
    let connection, localStream;

    peer.on('open', id => myIdDisplay.innerText = id);

    // Incoming Chat
    peer.on('connection', conn => {
        connection = conn;
        setupEvents();
    });

    // Incoming Call
    peer.on('call', call => {
        if (confirm("Answer video call?")) {
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                localStream = stream;
                showVideo(stream);
                call.answer(stream);
                call.on('stream', rs => document.getElementById('remote-video').srcObject = rs);
            });
        }
    });

    function connectToFriend() {
        const id = document.getElementById('friend-id').value;
        if (!id) return;
        connection = peer.connect(id);
        setupEvents();
    }

    async function startCall() {
        const id = document.getElementById('friend-id').value;
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        showVideo(localStream);
        const call = peer.call(id, localStream);
        call.on('stream', rs => document.getElementById('remote-video').srcObject = rs);
    }

    function showVideo(stream) {
        document.getElementById('video-overlay').style.display = 'block';
        document.getElementById('local-video').srcObject = stream;
    }

    function setupEvents() {
        connection.on('open', () => {
            appendMessage("", "CONNECTED", 'system');
            document.getElementById('v-call-btn').style.display = 'block';
        });
        connection.on('data', data => appendMessage("Friend", data, 'received'));
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (connection && input.value) {
            connection.send(input.value);
            appendMessage("You", input.value, 'sent');
            input.value = "";
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    // Prevents keyboard from hiding input
    window.addEventListener('resize', () => {
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>

</body>
</html>
