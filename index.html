<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hotspot Chat & Video</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #fff; --accent: #0a84ff; --secondary: #323232; --danger: #ff3b30; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* Main Layout */
        .container { display: flex; flex-direction: column; height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        
        #header { padding: 12px 15px; background: var(--card); border-bottom: 1px solid var(--secondary); flex-shrink: 0; }
        .id-badge { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
        
        /* Video Section */
        #video-container { display: none; position: relative; background: #000; height: 200px; flex-shrink: 0; overflow: hidden; border-bottom: 1px solid var(--secondary); }
        video { width: 50%; height: 100%; object-fit: cover; background: #222; }
        #remote-video { border-left: 1px solid #333; }
        .end-call { position: absolute; bottom: 10px; right: 10px; background: var(--danger); padding: 5px 10px; border-radius: 10px; font-size: 12px; }

        /* Chat Section */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 80%; font-size: 15px; word-wrap: break-word; }
        .sent { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--secondary); border-bottom-left-radius: 4px; }
        .system { align-self: center; font-size: 11px; color: #888; text-align: center; margin: 5px 0; }

        #controls { padding: 12px 15px; background: var(--card); border-top: 1px solid var(--secondary); flex-shrink: 0; }
        .row { display: flex; gap: 8px; align-items: center; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid var(--secondary); background: #2c2c2e; color: white; font-size: 16px; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        .call-btn { background: #30d158; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="header">
        <div style="font-size: 12px; color: #888;">MY ID: <span id="my-id" class="id-badge">....</span></div>
        <div class="row" style="margin-top: 8px;">
            <input id="friend-id" type="number" pattern="\d*" placeholder="Enter ID">
            <button onclick="connectToFriend()">Connect</button>
            <button id="v-call-btn" class="call-btn" onclick="startCall()">Video</button>
        </div>
    </div>

    <div id="video-container">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
        <button class="end-call" onclick="location.reload()">End</button>
    </div>

    <div id="chat-box">
        <div class="msg system">Ready to connect</div>
    </div>

    <div id="controls">
        <div class="row">
            <input id="message-input" type="text" placeholder="Message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const myIdDisplay = document.getElementById('my-id');
    const shortId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(shortId); 
    let connection, localStream;

    peer.on('open', id => myIdDisplay.innerText = id);

    // Handle Text Connection
    peer.on('connection', conn => {
        connection = conn;
        setupEvents();
    });

    // Handle Video Call
    peer.on('call', call => {
        if (confirm("Incoming Video Call! Answer?")) {
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                localStream = stream;
                document.getElementById('video-container').style.display = 'flex';
                document.getElementById('local-video').srcObject = stream;
                call.answer(stream);
                call.on('stream', remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            });
        }
    });

    function connectToFriend() {
        const id = document.getElementById('friend-id').value;
        if (!id) return;
        connection = peer.connect(id);
        setupEvents();
    }

    async function startCall() {
        const id = document.getElementById('friend-id').value;
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('video-container').style.display = 'flex';
        document.getElementById('local-video').srcObject = localStream;
        
        const call = peer.call(id, localStream);
        call.on('stream', remoteStream => {
            document.getElementById('remote-video').srcObject = remoteStream;
        });
    }

    function setupEvents() {
        connection.on('open', () => {
            appendMessage("", "Connected!", 'system');
            document.getElementById('v-call-btn').style.display = 'block';
        });
        connection.on('data', data => appendMessage("Friend", data, 'received'));
    }

    function sendMessage() {
        const input = document.getElementById('message-input');
        if (connection && input.value) {
            connection.send(input.value);
            appendMessage("You", input.value, 'sent');
            input.value = "";
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
